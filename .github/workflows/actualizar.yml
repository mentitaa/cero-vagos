# Recolección diaria de Cero Vagos, en los servidores de GitHub.
#
# Corre sola todas las madrugadas, sin depender de que la laptop esté prendida.
# Al terminar guarda las ofertas nuevas en el repositorio y el sitio publicado
# queda actualizado.
#
# Para lanzarla a mano: pestaña Actions → "Recolección diaria" → Run workflow.

name: Recolección diaria

on:
  schedule:
    # 05:00 UTC = 00:00 en Perú (Perú no cambia de hora en todo el año).
    # GitHub puede atrasarla algunos minutos si tiene mucha carga; no importa.
    - cron: "0 5 * * *"
  workflow_dispatch:          # botón para correrla cuando quieras
    inputs:
      limite:
        description: "Avisos por portal privado"
        default: "120"
      limite_cas:
        description: "Avisos de Convocatorias CAS"
        default: "120"
      limite_publicas:
        description: "Avisos de Convocatorias del Estado"
        default: "300"
      # Solo afecta a Bumeran. El Estado y Laborum van sin ventana por decisión
      # propia, explicada en cada paso: con ventana entregan cero.
      dias:
        description: "Días hacia atrás, solo para Bumeran (0 = sin límite)"
        default: "3"
      # El motor no vuelve a mirar un aviso rechazado hasta pasados 30 días.
      # Está bien para el día a día —ahorra descargar lo mismo cada noche— pero
      # impide volver a correr una fuente para ver qué pasó con ella. El
      # 6/8/2026 se corrió CAS dos veces seguidas y la segunda saltó 77 de 80
      # avisos: el registro salió vacío y no hubo nada que medir.
      #
      # Ojo: esto NO vuelve a puntuar lo guardado, vuelve a DESCARGARLO. Para
      # repuntuar tras cambiar el filtro está la casilla `reevaluar` del otro
      # flujo (regla 7).
      rehacer:
        description: "¿Volver a revisar avisos ya vistos? (solo fuentes públicas, para diagnosticar)"
        type: boolean
        default: false

# Si una corrida se demora, la siguiente espera en vez de pisarla.
concurrency:
  group: recoleccion
  cancel-in-progress: false

permissions:
  contents: write             # para poder guardar las ofertas recolectadas

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Traer el proyecto
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber playwright

      # Para leerle las letras a las bases que vienen escaneadas.
      #
      # Medido el 6/8/2026: de 78 convocatorias CAS, 31 se quedaron sin
      # funciones porque su PDF era una foto (o traía el texto roto por un
      # escaneo mal hecho). Sin estos dos programas, esas 31 no llegan al
      # umbral y no se publican.
      #
      # `tesseract-ocr-spa` no es opcional aunque el motor funcione sin él: sin
      # el paquete de español lee sin tildes ni eñes, y "gestión" sale "gestién".
      # `poppler-utils` trae pdftoppm, que convierte cada página en imagen.
      - name: Instalar el lector de imágenes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa poppler-utils
          tesseract --list-langs

      - name: Instalar el navegador
        run: python -m playwright install --with-deps chromium

      # Cada fuente tiene su propio reloj: así una lenta no se come el tiempo
      # de las demás ni tumba la corrida entera. Los cuatro relojes suman 165
      # minutos y el trabajo entero tiene 180, o sea que queda margen para
      # instalar Python y el navegador. Si se sube uno, hay que bajar otro o
      # subir el `timeout-minutes` del trabajo.
      #
      # A las fuentes públicas se les da MÁS margen que a los privados, al revés
      # de lo que parecería por volumen. La razón está en los números: de sus
      # avisos, el 100% declara sueldo, contra el 6% de Bumeran.
      #
      # Las dos van en pasos SEPARADOS, por la misma lección que ya costó cara
      # con Bumeran y Laborum: compartir un reloj hace que la segunda se quede
      # siempre a medias.
      #
      # Las dos van SIN ventana de días, igual que Laborum y por una razón
      # parecida. Una convocatoria CAS se publica y queda abierta dos o tres
      # semanas, así que casi ninguna tiene menos de 3 días aunque esté
      # perfectamente vigente. Con la ventana puesta pasaba algo peor que
      # perderlas: a los 40 avisos viejos seguidos el motor da por agotado lo
      # nuevo y corta la búsqueda. El 5/8/2026 se detuvo en la dirección 100 de
      # 512 y la fuente entregó cero, en verde y en minuto y medio.
      #
      # `--dias 0` no es "sin límite": la fuente cae a su tope de 60 días, que
      # es el mismo que ya aplica el filtro.

      # Convocatorias CAS va PRIMERA porque es la que trae convocatorias
      # abiertas. convocape.com resultó ser un archivo: de sus 512 direcciones,
      # 413 tienen el plazo cerrado.
      # La casilla `rehacer` solo llega a las fuentes públicas, y a propósito:
      # se leen por HTTP y cada aviso cuesta segundos. Bumeran y Laborum
      # necesitan navegador, así que rehacerlas no cabría en su reloj.
      #
      # Cuando la casilla va sin marcar, la variable queda vacía y el comando
      # sale exactamente como antes.
      # Sube de 35 a 45 minutos por el OCR: leer una página cuesta segundo y
      # medio, y en una corrida hay unas 45 convocatorias sin funciones a las
      # que intentárselo. Los 10 minutos salen del paso del Estado, que es un
      # archivo casi todo cerrado y no los necesita.
      - name: Convocatorias CAS
        timeout-minutes: 45
        env:
          REHACER: ${{ github.event.inputs.rehacer == 'true' && '--rehacer' || '' }}
        run: |
          python -u -m motor recolectar --fuente "Convocatorias CAS" --publicas \
            --limite ${{ github.event.inputs.limite_cas || 120 }} \
            --dias 0 $REHACER \
            --exportar
        continue-on-error: true

      - name: Convocatorias del Estado
        timeout-minutes: 20
        env:
          REHACER: ${{ github.event.inputs.rehacer == 'true' && '--rehacer' || '' }}
        run: |
          python -u -m motor recolectar --fuente "Convocatorias del Estado" --publicas \
            --limite ${{ github.event.inputs.limite_publicas || 300 }} \
            --dias 0 $REHACER \
            --exportar
        continue-on-error: true

      # Bumeran y Laborum van en pasos SEPARADOS, y esto importa.
      #
      # Mientras compartieron un paso se recorrían siempre en el mismo orden, y
      # cuando el reloj se acababa el que quedaba a medias era siempre el
      # segundo. Se veía en los números sin que nadie lo relacionara: Bumeran
      # llevaba 779 avisos revisados y Laborum 327. El 5/8/2026 el paso se cortó
      # y Laborum directamente no llegó a correr.
      #
      # Con un reloj para cada uno, una fuente lenta ya no se come el tiempo de
      # la otra.
      - name: Bumeran
        timeout-minutes: 50
        run: |
          python -u -m motor recolectar --fuente Bumeran \
            --limite ${{ github.event.inputs.limite || 120 }} \
            --dias ${{ github.event.inputs.dias || 3 }} \
            --exportar
        continue-on-error: true

      # Laborum va SIN ventana de días, y no es un descuido.
      #
      # Su sitemap tiene 50 mil direcciones y no vienen ordenadas por fecha, así
      # que las 240 que alcanzamos a mirar son un trozo cualquiera del archivo.
      # Con la ventana de 3 días se descartaban 239 de 240 sin ni siquiera
      # mirarlas: la fuente aportaba cero todas las noches, en verde y sin un
      # solo error. Sin ventana, de esas mismas 240 pasan el filtro un 4%.
      #
      # No entra basura vieja por esto: el filtro rechaza igual todo lo de más
      # de 60 días. Se comprobó el 5/8/2026 — cero avisos vencidos en la pasada.
      # Y va con el doble de avisos que Bumeran. También a propósito: sin
      # ventana de días alcanza a mirar mucho más de su archivo, y con el
      # navegador arreglado cada aviso cuesta unos segundos, no medio minuto.
      # 240 avisos son unos 16 minutos, cómodos dentro de sus 50.
      - name: Laborum
        timeout-minutes: 50
        run: |
          python -u -m motor recolectar --fuente Laborum \
            --limite ${{ github.event.inputs.limite || 240 }} \
            --dias 0 \
            --exportar
        continue-on-error: true

      # No lleva la dirección escrita a mano: la lee del archivo CNAME que
      # GitHub crea al conectar un dominio propio. El día que se compre
      # cerovagos.com, todo sale con el dominio nuevo sin tocar nada.
      - name: Generar la página de cada oferta
        run: python -u -m motor publicar

      - name: Cómo quedó la base
        run: python -u -m motor stats

      # SIEMPRE se guarda, aunque algo antes haya fallado o se haya pasado de
      # tiempo. Sin esto, una corrida que se corta a las cuatro horas pierde
      # todo lo recolectado: vive en el servidor de GitHub y se borra con él.
      - name: Guardar las ofertas nuevas
        if: always()
        run: |
          git config user.name  "Cero Vagos"
          git config user.email "info@cerovagos.com"
          # Se agrega todo lo que haya cambiado. Nombrar los archivos uno por
          # uno hacía fallar el paso la primera vez, cuando el sitemap y la
          # carpeta de ofertas todavía no existían. Lo que no debe subir ya
          # está listado en .gitignore.
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: no había ofertas nuevas."
          else
            git commit -m "Ofertas del $(date +%d/%m/%Y)"
            git push
          fi
