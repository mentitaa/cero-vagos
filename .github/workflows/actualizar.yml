name: Recolección diaria

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Avisos por portal"
        default: "120"
      dias:
        description: "Solo avisos publicados en los últimos N días (0 = sin límite)"
        default: "3"

concurrency:
  group: recoleccion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Traer el proyecto
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber playwright

      - name: Instalar el navegador
        run: python -m playwright install --with-deps chromium

      - name: Convocatorias del Estado
        timeout-minutes: 45
        run: |
          python -u -m motor recolectar --publicas \
            --limite ${{ github.event.inputs.limite || 120 }} \
            --dias ${{ github.event.inputs.dias || 3 }} \
            --exportar
        continue-on-error: true

      - name: Portales privados
        timeout-minutes: 60
        run: |
          python -u -m motor recolectar \
            --limite ${{ github.event.inputs.limite || 120 }} \
            --dias ${{ github.event.inputs.dias || 3 }} \
            --exportar
        continue-on-error: true

      - name: Generar la página de cada oferta
        run: python -u -m motor publicar

      - name: Cómo quedó la base
        run: python -u -m motor stats

      - name: Guardar las ofertas nuevas
        if: always()
        run: |
          git config user.name  "Cero Vagos"
          git config user.email "bot@cerovagos.pe"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: no había ofertas nuevas."
          else
            git commit -m "Ofertas del $(date +%d/%m/%Y)"
            git push
          fi
