# Recolección diaria de Cero Vagos, en los servidores de GitHub.
#
# Corre sola todas las madrugadas, sin depender de que la laptop esté prendida.
# Al terminar guarda las ofertas nuevas en el repositorio y el sitio publicado
# queda actualizado.
#
# Para lanzarla a mano: pestaña Actions → "Recolección diaria" → Run workflow.

name: Recolección diaria

on:
  schedule:
    # 05:00 UTC = 00:00 en Perú (Perú no cambia de hora en todo el año).
    # GitHub puede atrasarla algunos minutos si tiene mucha carga; no importa.
    - cron: "0 5 * * *"
  workflow_dispatch:          # botón para correrla cuando quieras
    inputs:
      limite:
        description: "Avisos por portal privado"
        default: "120"
      limite_publicas:
        description: "Avisos de Convocatorias del Estado"
        default: "300"
      dias:
        description: "Solo avisos publicados en los últimos N días (0 = sin límite)"
        default: "3"

# Si una corrida se demora, la siguiente espera en vez de pisarla.
concurrency:
  group: recoleccion
  cancel-in-progress: false

permissions:
  contents: write             # para poder guardar las ofertas recolectadas

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Traer el proyecto
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber playwright

      - name: Instalar el navegador
        run: python -m playwright install --with-deps chromium

      # Cada fuente tiene su propio reloj: así una lenta no se come el tiempo
      # de las demás ni tumba la corrida entera.
      # Al Estado se le da MÁS margen que a los privados, al revés de lo que
      # parecería por volumen. La razón está en los números: de sus avisos, el
      # 100% declara sueldo; de los de Bumeran, el 6%. Es también la única
      # fuente que trae ciudades fuera de Lima.
      - name: Convocatorias del Estado
        timeout-minutes: 60
        run: |
          python -u -m motor recolectar --publicas \
            --limite ${{ github.event.inputs.limite_publicas || 300 }} \
            --dias 0 \
            --exportar
        continue-on-error: true

      # Bumeran y Laborum van en pasos SEPARADOS, y esto importa.
      #
      # Mientras compartieron un paso se recorrían siempre en el mismo orden, y
      # cuando el reloj se acababa el que quedaba a medias era siempre el
      # segundo. Se veía en los números sin que nadie lo relacionara: Bumeran
      # llevaba 779 avisos revisados y Laborum 327. El 5/8/2026 el paso se cortó
      # y Laborum directamente no llegó a correr.
      #
      # Con un reloj para cada uno, una fuente lenta ya no se come el tiempo de
      # la otra.
      - name: Bumeran
        timeout-minutes: 50
        run: |
          python -u -m motor recolectar --fuente Bumeran \
            --limite ${{ github.event.inputs.limite || 120 }} \
            --dias ${{ github.event.inputs.dias || 3 }} \
            --exportar
        continue-on-error: true

      - name: Laborum
        timeout-minutes: 50
        run: |
          python -u -m motor recolectar --fuente Laborum \
            --limite ${{ github.event.inputs.limite || 240 }} \
            --dias 0 \
            --exportar
        continue-on-error: true

      # No lleva la dirección escrita a mano: la lee del archivo CNAME que
      # GitHub crea al conectar un dominio propio. El día que se compre
      # cerovagos.com, todo sale con el dominio nuevo sin tocar nada.
      - name: Generar la página de cada oferta
        run: python -u -m motor publicar

      - name: Cómo quedó la base
        run: python -u -m motor stats

      # SIEMPRE se guarda, aunque algo antes haya fallado o se haya pasado de
      # tiempo. Sin esto, una corrida que se corta a las cuatro horas pierde
      # todo lo recolectado: vive en el servidor de GitHub y se borra con él.
      - name: Guardar las ofertas nuevas
        if: always()
        run: |
          git config user.name  "Cero Vagos"
          git config user.email "info@cerovagos.com"
          # Se agrega todo lo que haya cambiado. Nombrar los archivos uno por
          # uno hacía fallar el paso la primera vez, cuando el sitemap y la
          # carpeta de ofertas todavía no existían. Lo que no debe subir ya
          # está listado en .gitignore.
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: no había ofertas nuevas."
          else
            git commit -m "Ofertas del $(date +%d/%m/%Y)"
            git push
          fi
